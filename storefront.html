<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storefront - Fundline</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="storefront-shell">
      <main class="storefront-main">
        <header class="storefront-header">
          <div class="brand storefront-brand">
            <img src="/assets/fundline-logo.png?v=2" alt="" class="brand-img" />
          </div>
          <p class="eyebrow storefront-seller" id="sellerWallet">Loading...</p>
          <h1 class="storefront-title">Products</h1>
        </header>

        <section id="productsSection">
          <div class="invoice-list" id="productsList">
            <p class="storefront-loading">Loading products...</p>
          </div>
        </section>
      </main>
    </div>
    <script src="/storefront.js"></script>
  </body>
</html>
