<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storefront - Fundline</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell" style="grid-template-columns: 1fr; max-width: 800px; margin: 0 auto;">
      <main class="main" style="padding: 40px 24px;">
        <header class="topbar" style="border: none; padding: 0 0 24px 0; justify-content: center; text-align: center;">
          <div>
            <div class="brand" style="justify-content: center; margin-bottom: 16px;">
              <img src="/assets/fundline-logo.png?v=2" alt="" class="brand-img" />
            </div>
            <p class="eyebrow" id="sellerWallet">Loading...</p>
            <h1>Products</h1>
          </div>
        </header>

        <section id="productsSection">
          <div class="invoice-list" id="productsList">
            <p style="text-align: center;">Loading products...</p>
          </div>
        </section>
      </main>
    </div>
    <script src="/storefront.js"></script>
  </body>
</html>
