<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workflows - Fundline</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

        <nav class="nav" aria-label="Main navigation">

          <div class="nav-group" id="sidePaymentsGroup">
            <button class="nav-group-toggle" type="button" aria-expanded="false" aria-controls="sidePaymentsChildren">

                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" /></svg>
                New invoice
              </a>
              <a class="nav-item" href="/app">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12M6 16h12M9 5v6M15 13v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
                Settings
              </a>
            </div>
          </div>

          <div class="nav-group is-open" id="sideWorkflowsGroup">
            <button class="nav-group-toggle" type="button" aria-expanded="true" aria-controls="sideWorkflowsChildren">

                Settings
              </a>
            </div>
          </div>

          <div class="nav-group nav-group-soon">

              Developers
              <span class="soon-badge">Soon</span>
              <svg class="nav-group-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="nav-group-children" id="sideDevChildren">
              <button class="nav-item nav-item-disabled" type="button" disabled aria-disabled="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                API Keys
              </button>
              <button class="nav-item nav-item-disabled" type="button" disabled aria-disabled="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>

            <button class="nav-group-toggle" type="button" aria-expanded="false" aria-controls="sideAgentsChildren">

                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5M9 8V2M15 8V2M17 8H7a2 2 0 0 0-2 2v5a5 5 0 0 0 10 0v-5a2 2 0 0 0-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Agent APIs
              </button>
              <button class="nav-item nav-item-disabled" type="button" disabled aria-disabled="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                Access Keys
              </button>
              <button class="nav-item nav-item-disabled" type="button" disabled aria-disabled="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                Runs
              </button>
              <button class="nav-item nav-item-disabled" type="button" disabled aria-disabled="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12M6 16h12M9 5v6M15 13v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
                Settings
              </button>
            </div>
          </div>

        </nav>
        <div class="network-pill">
          <span></span>
          Arc Testnet

      <main class="main wf-main" id="wfRoot">
        <div class="wf-loading" id="wfLoading" aria-live="polite">
          <div class="wf-loading-dot"></div>
        </div>
      </main>
    </div>
    <script src="/workflows.js"></script>
  </body>
</html>
